<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="合成大鲸鱼">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6d92ff"/>
      <stop offset="0.45" stop-color="#2f55d4"/>
      <stop offset="1" stop-color="#122459"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3d8ff"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M12 36.5C12 27.5 20.5 20.5 31 20.5c11 0 19 5 21 12 1.6 6.5-3.5 13-14 14.5-13 1.8-26-1.5-26-10.5z"/>
    </clipPath>
    <filter id="frillShade" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.9" stdDeviation="0.9" flood-color="#1b2f78" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 海底：深蓝渐变 + 两道柔光柱 -->
  <rect width="64" height="64" rx="15" fill="url(#sea)"/>
  <g fill="#ffffff" opacity="0.09">
    <path d="M13 0h11L16 64H4z"/>
    <path d="M34 0h8l-3 64h-9z"/>
  </g>

  <!-- 两只一样的小气泡合成一只大的 -->
  <g fill="#ffffff">
    <circle cx="45.5" cy="12.5" r="3.1" opacity="0.95"/>
    <circle cx="54.5" cy="12.5" r="3.1" opacity="0.95"/>
    <circle cx="50" cy="5" r="4.3" opacity="0.72"/>
  </g>

  <!-- 鲸鱼娘 -->
  <path d="M49.5 32c4.5-6.5 11.5-9.5 12.5-5.5.7 3.1-3.5 6-7 6.9 3.5 1 7.7 3.9 7 7-1 4-8 1-12.5-4.9z" fill="#4d6bfe"/>
  <ellipse cx="23" cy="46.6" rx="6.2" ry="3.9" transform="rotate(-22 23 46.6)" fill="#4d6bfe"/>
  <path d="M12 36.5C12 27.5 20.5 20.5 31 20.5c11 0 19 5 21 12 1.6 6.5-3.5 13-14 14.5-13 1.8-26-1.5-26-10.5z" fill="url(#skin)"/>
  <g clip-path="url(#bodyClip)">
    <ellipse cx="29" cy="50" rx="19.5" ry="9.5" fill="#4d6bfe"/>
  </g>
  <!-- 白色花边头饰 + 蝴蝶结 -->
  <path d="M13.5 29A6 6 0 0 1 20.5 18.5 5.5 5.5 0 0 1 30.5 15 5.5 5.5 0 0 1 40.5 18.5 5.5 5.5 0 0 1 44.5 23.5C43 21.5 39 19.8 34 19.8 26 19.8 18 23 13.5 29z" fill="#ffffff" filter="url(#frillShade)"/>
  <path d="M22 16.8l-6-3.4v6.9z" fill="#ff9ec7"/>
  <path d="M22 16.8l6-3.4v6.9z" fill="#ff9ec7"/>
  <circle cx="22" cy="16.8" r="1.9" fill="#f277b0"/>
  <!-- 眼睛、腮红、嘴 -->
  <circle cx="22.5" cy="34.8" r="3.4" fill="#1b2147"/>
  <circle cx="23.9" cy="33.4" r="1.2" fill="#ffffff"/>
  <ellipse cx="15.8" cy="41.2" rx="3" ry="1.9" fill="#ff9ec7" opacity="0.85"/>
  <path d="M19 42.8c2.5 2.1 6.2 2.1 8.4-.6" stroke="#1b2147" stroke-width="1.9" fill="none" stroke-linecap="round"/>
</svg>
